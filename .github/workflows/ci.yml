name: CI

on:
  push:
    tags: ['v*']
  # Dry run: builds every platform and every installer without publishing,
  # so release-only changes can be checked before a tag. The version must
  # be numeric (it lands in the Windows file metadata).
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build
        default: v0.0.0
# Builds use inputs.version on a dry run and the tag otherwise.

jobs:
  # ── Go vet + unit tests (all platforms) ──
  # cmd/gui embeds frontend/dist (go:embed), so the frontend is built first.
  # Without Wails' desktop/production build tags the GUI package compiles
  # against Wails' stub app, so no WebKitGTK is needed on Linux here.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history with tags: update.ResolveVersion (and its test)
          # derive dev versions from `git describe --tags`. A tag push carries
          # its own tag; a dry run from a branch does not.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build frontend
        shell: bash
        working-directory: cmd/gui/frontend
        run: npm ci && npm run build
      - name: Go vet
        run: go vet ./...
      - name: Run tests
        run: go test -short ./...

  # ── GUI build (native per platform, needs webview libs) ──
  gui-windows:
    runs-on: windows-latest
    needs: test
    env:
      LDFLAGS: >-
        -X main.version=${{ inputs.version || github.ref_name }}
        -X main.commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Copy app icons
        shell: bash
        run: |
          mkdir -p cmd/gui/build/windows
          cp assets/appicon.png cmd/gui/build/appicon.png
          cp assets/icon.ico    cmd/gui/build/windows/icon.ico
      - name: Set version in wails.json
        shell: bash
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          VER="${VER#v}"
          sed -i.bak "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${VER}\"/" cmd/gui/wails.json && rm -f cmd/gui/wails.json.bak
      - name: Build GUI
        shell: bash
        working-directory: cmd/gui
        run: wails build -ldflags "$LDFLAGS"
      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows
          path: cmd/gui/build/bin/GitboxApp.exe

  gui-macos-arm64:
    runs-on: macos-latest
    needs: test
    env:
      # Go's runtime targets macOS 13; give cgo and the linker the same
      # minimum (Wails adds 10.13 only when none is set). Info.plist in
      # cmd/gui/build/darwin declares it to the OS.
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
      LDFLAGS: >-
        -X main.version=${{ inputs.version || github.ref_name }}
        -X main.commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Copy app icons
        run: |
          mkdir -p cmd/gui/build
          cp assets/appicon.png cmd/gui/build/appicon.png
      - name: Set version in wails.json
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          VER="${VER#v}"
          sed -i.bak "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${VER}\"/" cmd/gui/wails.json && rm -f cmd/gui/wails.json.bak
      - name: Build GUI
        working-directory: cmd/gui
        run: wails build -ldflags "$LDFLAGS"
      - name: Zip macOS app bundle
        run: cd cmd/gui/build/bin && zip -r gitbox-macos-arm64.zip GitboxApp.app
      - uses: actions/upload-artifact@v7
        with:
          name: gui-macos-arm64
          path: cmd/gui/build/bin/gitbox-macos-arm64.zip

  gui-macos-amd64:
    runs-on: macos-latest
    needs: test
    env:
      # Go's runtime targets macOS 13; give cgo and the linker the same
      # minimum (Wails adds 10.13 only when none is set). Info.plist in
      # cmd/gui/build/darwin declares it to the OS.
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
      GOARCH: amd64
      LDFLAGS: >-
        -X main.version=${{ inputs.version || github.ref_name }}
        -X main.commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
        env:
          GOARCH: arm64
      - name: Copy app icons
        run: |
          mkdir -p cmd/gui/build
          cp assets/appicon.png cmd/gui/build/appicon.png
      - name: Set version in wails.json
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          VER="${VER#v}"
          sed -i.bak "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${VER}\"/" cmd/gui/wails.json && rm -f cmd/gui/wails.json.bak
      - name: Build GUI
        working-directory: cmd/gui
        run: wails build -platform darwin/amd64 -ldflags "$LDFLAGS"
      - name: Zip macOS app bundle
        run: cd cmd/gui/build/bin && zip -r gitbox-macos-amd64.zip GitboxApp.app
      - uses: actions/upload-artifact@v7
        with:
          name: gui-macos-amd64
          path: cmd/gui/build/bin/gitbox-macos-amd64.zip

  # Oldest supported Ubuntu on purpose: the AppImage bundles this runner's
  # GTK/WebKitGTK libraries, and libraries from a newer base need a newer
  # glibc than the systems the AppImage should run on (24.04 libs want
  # glibc 2.38; the AppImage catalog tests on 22.04 with glibc 2.35).
  gui-linux:
    runs-on: ubuntu-22.04
    needs: test
    env:
      LDFLAGS: >-
        -X main.version=${{ inputs.version || github.ref_name }}
        -X main.commit=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Copy app icons
        run: |
          mkdir -p cmd/gui/build
          cp assets/appicon.png cmd/gui/build/appicon.png
      - name: Set version in wails.json
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          VER="${VER#v}"
          sed -i.bak "s/\"productVersion\": \"0.0.0\"/\"productVersion\": \"${VER}\"/" cmd/gui/wails.json && rm -f cmd/gui/wails.json.bak
      - name: Build GUI
        working-directory: cmd/gui
        run: wails build -tags webkit2_41 -ldflags "$LDFLAGS"
      - uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: cmd/gui/build/bin/GitboxApp

  # ── Windows Inno Setup installer ──
  installer-windows:
    runs-on: windows-latest
    needs: gui-windows
    steps:
      - uses: actions/checkout@v7
      # Download by name into its own folder: without a name, a run that
      # has only one artifact uploaded so far extracts it straight into
      # artifacts/ (no subfolder), which is what broke the v2.1.0 AppImage.
      - uses: actions/download-artifact@v8
        with:
          name: gui-windows
          path: artifacts/gui-windows
      - name: Prepare installer files
        shell: bash
        run: |
          mkdir -p tmp-win release
          cp artifacts/gui-windows/GitboxApp.exe tmp-win/GitboxApp.exe
      - name: Build installer
        shell: cmd
        env:
          GITBOX_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\installer.iss
      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: release/gitbox-win-amd64-setup.exe

  # ── macOS DMG (arm64) ──
  dmg-macos-arm64:
    runs-on: macos-latest
    needs: gui-macos-arm64
    steps:
      - uses: actions/checkout@v7
      # By name, see the note in installer-windows.
      - uses: actions/download-artifact@v8
        with:
          name: gui-macos-arm64
          path: artifacts/gui-macos-arm64
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Stage DMG contents
        run: |
          mkdir -p staging release
          cd staging && unzip ../artifacts/gui-macos-arm64/gitbox-macos-arm64.zip
          cd ..
          cp 'scripts/dmg/Install Gitbox.command' staging/
          cp scripts/dmg/README.txt staging/
          chmod +x 'staging/Install Gitbox.command'
          sed -i '' 's/\r$//' 'staging/Install Gitbox.command'
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
      - name: Codesign app bundle
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          codesign --force --deep --sign "$APPLE_IDENTITY" --options runtime staging/GitboxApp.app
      - name: Build DMG
        run: |
          create-dmg \
            --volname "gitbox" \
            --window-pos 200 120 --window-size 660 500 \
            --icon-size 100 \
            --icon "GitboxApp.app" 150 170 \
            --app-drop-link 450 170 \
            --hide-extension "GitboxApp.app" \
            --icon "Install Gitbox.command" 150 370 \
            --hide-extension "Install Gitbox.command" \
            --icon "README.txt" 450 370 \
            release/gitbox-macos-arm64.dmg staging/ || test $? -eq 2
      - name: Notarize DMG
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit release/gitbox-macos-arm64.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple release/gitbox-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: dmg-macos-arm64
          path: release/gitbox-macos-arm64.dmg

  # ── macOS DMG (amd64) ──
  dmg-macos-amd64:
    runs-on: macos-latest
    needs: gui-macos-amd64
    steps:
      - uses: actions/checkout@v7
      # By name, see the note in installer-windows.
      - uses: actions/download-artifact@v8
        with:
          name: gui-macos-amd64
          path: artifacts/gui-macos-amd64
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Stage DMG contents
        run: |
          mkdir -p staging release
          cd staging && unzip ../artifacts/gui-macos-amd64/gitbox-macos-amd64.zip
          cd ..
          cp 'scripts/dmg/Install Gitbox.command' staging/
          cp scripts/dmg/README.txt staging/
          chmod +x 'staging/Install Gitbox.command'
          sed -i '' 's/\r$//' 'staging/Install Gitbox.command'
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
      - name: Codesign app bundle
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          codesign --force --deep --sign "$APPLE_IDENTITY" --options runtime staging/GitboxApp.app
      - name: Build DMG
        run: |
          create-dmg \
            --volname "gitbox" \
            --window-pos 200 120 --window-size 660 500 \
            --icon-size 100 \
            --icon "GitboxApp.app" 150 170 \
            --app-drop-link 450 170 \
            --hide-extension "GitboxApp.app" \
            --icon "Install Gitbox.command" 150 370 \
            --hide-extension "Install Gitbox.command" \
            --icon "README.txt" 450 370 \
            release/gitbox-macos-amd64.dmg staging/ || test $? -eq 2
      - name: Notarize DMG
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit release/gitbox-macos-amd64.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple release/gitbox-macos-amd64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: dmg-macos-amd64
          path: release/gitbox-macos-amd64.dmg

  # ── Linux AppImage ──
  appimage-linux:
    runs-on: ubuntu-22.04 # same base as gui-linux, see the note there
    needs: gui-linux
    steps:
      - uses: actions/checkout@v7
      # By name, see the note in installer-windows.
      - uses: actions/download-artifact@v8
        with:
          name: gui-linux
          path: artifacts/gui-linux
      # The GUI's GTK 3 + WebKitGTK stack gets bundled into the AppImage, so
      # the build host needs the same libraries gui-linux compiled against.
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgles2 gobject-introspection libgirepository1.0-dev appstream desktop-file-utils file
      - name: Build AppImage
        run: |
          scripts/appimage/build-appimage.sh \
            artifacts/gui-linux/GitboxApp \
            "${{ inputs.version || github.ref_name }}" \
            release/gitbox-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-linux
          path: release/gitbox-x86_64.AppImage

  # ── GitHub Release with all binaries ──
  release:
    runs-on: ubuntu-latest
    needs: [gui-windows, gui-macos-arm64, gui-macos-amd64, gui-linux, installer-windows, dmg-macos-arm64, dmg-macos-amd64, appimage-linux]
    if: always() && github.event_name == 'push' && needs.gui-windows.result == 'success' && needs.gui-macos-arm64.result == 'success' && needs.gui-macos-amd64.result == 'success' && needs.gui-linux.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Asset names stay the same as in v1 so v1 GUI installs find them and
      # auto-update to v2. v2 archives carry only GitboxApp; the CLI/TUI
      # lives on in the 1.x releases.
      - name: Prepare release assets
        run: |
          mkdir -p release tmp-win tmp-linux

          # Windows (amd64): GitboxApp.exe → gitbox-win-amd64.zip
          cp artifacts/gui-windows/GitboxApp.exe tmp-win/GitboxApp.exe
          (cd tmp-win && zip ../release/gitbox-win-amd64.zip GitboxApp.exe)

          # macOS: the gui-macos-* jobs already zip GitboxApp.app under the
          # release asset name.
          cp artifacts/gui-macos-arm64/gitbox-macos-arm64.zip release/
          cp artifacts/gui-macos-amd64/gitbox-macos-amd64.zip release/

          # Linux (amd64): GitboxApp → gitbox-linux-amd64.zip. Artifacts lose
          # their execute bit on download, so restore it before zipping.
          cp artifacts/gui-linux/GitboxApp tmp-linux/GitboxApp
          chmod +x tmp-linux/GitboxApp
          (cd tmp-linux && zip ../release/gitbox-linux-amd64.zip GitboxApp)

      - name: Collect installer artifacts
        run: |
          cp artifacts/installer-windows/gitbox-win-amd64-setup.exe release/ 2>/dev/null || true
          cp artifacts/dmg-macos-arm64/gitbox-macos-arm64.dmg release/ 2>/dev/null || true
          cp artifacts/dmg-macos-amd64/gitbox-macos-amd64.dmg release/ 2>/dev/null || true
          cp artifacts/appimage-linux/gitbox-x86_64.AppImage release/ 2>/dev/null || true

      - name: Generate checksums
        run: cd release && sha256sum -- * > checksums.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the highest major line may become "latest": a v1.7.z
          # maintenance tag pushed after v2.0.0 must not hijack
          # releases/latest, which every v2 GUI's updater follows.
          tag="${{ inputs.version || github.ref_name }}"
          major="${tag#v}"; major="${major%%.*}"
          top="$(gh release list --repo "${{ github.repository }}" --limit 100 \
                   --json tagName -q '.[].tagName' \
                 | sed -E 's/^v([0-9]+)\..*/\1/' | grep -E '^[0-9]+$' | sort -n | tail -1)"
          latest=true
          if [ -n "$top" ] && [ "$major" -lt "$top" ]; then latest=false; fi
          echo "Publishing $tag with --latest=$latest (highest existing major: ${top:-none})"

          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "gitbox $tag" \
            --generate-notes \
            --latest="$latest" \
            release/*
