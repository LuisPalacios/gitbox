name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend build, go vet, unit tests and a Linux GUI build smoke ──
  # Same base image and WebKitGTK packages as the gui-linux release job, so
  # a green PR means the release build compiles too.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history with tags: update.ResolveVersion (and its test)
          # derive dev versions from `git describe --tags`.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch, not 'stable': staticcheck (pinned in
          # scripts/health.sh) can't read Go 1.27 export data yet. Move to
          # 'stable' once a staticcheck release supports 1.27.
          # check-latest: the runner cache can lag a patch behind, and
          # govulncheck flags stdlib fixes in the newest patch.
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/gui/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # cmd/gui embeds frontend/dist (go:embed), so go vet and go test need
      # the frontend built first.
      - name: Install frontend dependencies
        working-directory: cmd/gui/frontend
        run: npm ci
      - name: Build frontend
        working-directory: cmd/gui/frontend
        run: npm run build

      # scripts/health.sh is the gate: gofmt, vet, staticcheck, modernize,
      # govulncheck, deadcode, unit tests, svelte-check, frontend build and
      # npm ci warnings, npm audit, shellcheck, actionlint, markdownlint and
      # the agent harness mirror check (uv).
      # Any finding fails the job. Tools are pinned to the versions the
      # developer guide lists, so CI and local runs agree.
      - name: Install health check tools
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Health check
        run: ./scripts/health.sh -v

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Copy app icons
        run: |
          mkdir -p cmd/gui/build
          cp assets/appicon.png cmd/gui/build/appicon.png
      # -s skips the frontend build that already ran above.
      - name: Build GUI
        working-directory: cmd/gui
        run: wails build -s -tags webkit2_41
      - name: Smoke test
        run: cmd/gui/build/bin/GitboxApp --version

  # Exercise native filesystem and process behavior without launching a GUI.
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          # Version tests need tags and the history for git describe.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # setup-go and setup-node include the OS in their cache keys.
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/gui/frontend/package-lock.json
      # cmd/gui embeds frontend/dist even when tests use the Wails stub.
      - name: Build frontend
        shell: bash
        working-directory: cmd/gui/frontend
        run: npm ci && npm run build
      - name: Run native short tests
        run: go test -short ./pkg/config/ ./pkg/status/ ./pkg/credential/ ./pkg/update/ ./pkg/git/ ./pkg/workspace/ ./cmd/gui/
