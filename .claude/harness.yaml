# Mirror map for the mirroring-harness skill. .claude/ is the only hand-edited
# source; the Codex side is generated from it.
version: 1

source:
  main_file: .claude/CLAUDE.md
  rules_dir: .claude/rules
  context_dir: .claude/context
  skills_dir: .claude/skills

codex:
  main_file: AGENTS.md
  entry_title: AGENTS.md
  rules_dir: .codex/rules       # Codex has no rule loader: AGENTS.md says which rule to read first
  context_dir: .codex/context
  skills_dir: .agents/skills    # Codex's native repo skill folder
  max_bytes: 32768              # Codex's default project_doc_max_bytes: sync refuses above it
  warn_bytes: 28672             # early warning, leaves room for a personal ~/.codex/AGENTS.md

budgets:
  description_chars: 1024       # the Agent Skills limit for a skill description (fails above it)
  skill_lines: 500              # SKILL.md size from guideline_skills.md (warns above it)

banner: >-
  **Generated file, do not edit by hand.** The mirroring-harness skill renders it from
  `.claude/CLAUDE.md`. Edit the source under `.claude/` and run
  `uv run .claude/skills/mirroring-harness/scripts/sync.py sync`; direct edits here are overwritten.
